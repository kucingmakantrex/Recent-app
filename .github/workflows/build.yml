# HiOS Stack Recents (modul LSPosed) - cukup satu file ini.
# Simpan sebagai .github/workflows/build.yml di repository GitHub, lalu jalankan
# Actions > Build APK > Run workflow. Hasil: artifact HiOS-StackRecents-apk.
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Buat file proyek
        run: |
          cat > settings.gradle <<'EOF_0'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HiOSStackRecents"
          include ':app', ':xposed-stub'
          EOF_0
          cat > build.gradle <<'EOF_1'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_1
          cat > gradle.properties <<'EOF_2'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF_2
          cat > .gitignore <<'EOF_3'
          .gradle/
          build/
          local.properties
          .idea/
          *.iml
          EOF_3
          mkdir -p xposed-stub
          cat > xposed-stub/build.gradle <<'EOF_4'
          plugins {
              id 'java-library'
          }

          java {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }
          EOF_4
          mkdir -p xposed-stub/src/main/java/de/robv/android/xposed
          cat > xposed-stub/src/main/java/de/robv/android/xposed/XC_MethodHook.java <<'EOF_5'
          package de.robv.android.xposed;

          import java.lang.reflect.Member;

          public abstract class XC_MethodHook {
              public XC_MethodHook() {}

              public XC_MethodHook(int priority) {}

              protected void beforeHookedMethod(MethodHookParam param) throws Throwable {}

              protected void afterHookedMethod(MethodHookParam param) throws Throwable {}

              public static class MethodHookParam {
                  public Member method;
                  public Object thisObject;
                  public Object[] args;
              }

              public class Unhook {
                  public void unhook() {}
              }
          }
          EOF_5
          mkdir -p xposed-stub/src/main/java/de/robv/android/xposed
          cat > xposed-stub/src/main/java/de/robv/android/xposed/XposedBridge.java <<'EOF_6'
          package de.robv.android.xposed;

          public final class XposedBridge {
              private XposedBridge() {}
              public static void log(String text) {}
              public static void log(Throwable t) {}
          }
          EOF_6
          mkdir -p xposed-stub/src/main/java/de/robv/android/xposed
          cat > xposed-stub/src/main/java/de/robv/android/xposed/XposedHelpers.java <<'EOF_7'
          package de.robv.android.xposed;

          public class XposedHelpers {
              public static Class<?> findClassIfExists(String className, ClassLoader classLoader) {
                  return null;
              }

              public static XC_MethodHook.Unhook findAndHookMethod(Class<?> clazz, String methodName,
                                                                   Object... parameterTypesAndCallback) {
                  return null;
              }
          }
          EOF_7
          mkdir -p xposed-stub/src/main/java/de/robv/android/xposed
          cat > xposed-stub/src/main/java/de/robv/android/xposed/IXposedHookLoadPackage.java <<'EOF_8'
          package de.robv.android.xposed;

          import de.robv.android.xposed.callbacks.XC_LoadPackage;

          public interface IXposedHookLoadPackage {
              void handleLoadPackage(XC_LoadPackage.LoadPackageParam lpparam) throws Throwable;
          }
          EOF_8
          mkdir -p xposed-stub/src/main/java/de/robv/android/xposed/callbacks
          cat > xposed-stub/src/main/java/de/robv/android/xposed/callbacks/XC_LoadPackage.java <<'EOF_9'
          package de.robv.android.xposed.callbacks;

          public abstract class XC_LoadPackage {
              public static final class LoadPackageParam {
                  public String packageName;
                  public String processName;
                  public ClassLoader classLoader;
              }
          }
          EOF_9
          mkdir -p app
          cat > app/build.gradle <<'EOF_10'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'io.hios.stackrecents'
              compileSdk 34

              defaultConfig {
                  applicationId 'io.hios.stackrecents'
                  minSdk 28
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              // API Xposed disediakan LSPosed saat runtime; stub hanya untuk kompilasi
              compileOnly project(':xposed-stub')
          }
          EOF_10
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_11'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="HiOS Stack Recents">

                  <meta-data
                      android:name="xposedmodule"
                      android:value="true" />
                  <meta-data
                      android:name="xposeddescription"
                      android:value="Recent apps bertumpuk untuk HiOS Launcher 15" />
                  <meta-data
                      android:name="xposedminversion"
                      android:value="93" />
                  <meta-data
                      android:name="xposedscope"
                      android:resource="@array/xposed_scope" />
              </application>
          </manifest>
          EOF_11
          mkdir -p app/src/main/assets
          cat > app/src/main/assets/xposed_init <<'EOF_12'
          io.hios.stackrecents.Main
          EOF_12
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/arrays.xml <<'EOF_13'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string-array name="xposed_scope">
                  <item>com.transsion.hilauncher</item>
              </string-array>
          </resources>
          EOF_13
          mkdir -p app/src/main/java/io/hios/stackrecents
          cat > app/src/main/java/io/hios/stackrecents/Main.java <<'EOF_14'
          package io.hios.stackrecents;

          import android.graphics.Canvas;
          import android.view.View;
          import android.view.ViewGroup;

          import java.util.WeakHashMap;

          import de.robv.android.xposed.IXposedHookLoadPackage;
          import de.robv.android.xposed.XC_MethodHook;
          import de.robv.android.xposed.XposedBridge;
          import de.robv.android.xposed.XposedHelpers;
          import de.robv.android.xposed.callbacks.XC_LoadPackage.LoadPackageParam;

          /**
           * Membuat layar recent apps HiOS Launcher 15 tampil bertumpuk (deck).
           * Kartu di tengah paling depan; kartu lain mengintip dari belakang,
           * makin jauh makin kecil dan memudar.
           */
          public class Main implements IXposedHookLoadPackage {

              private static final String TAG = "[HiOSStackRecents] ";
              private static final String TARGET_PKG = "com.transsion.hilauncher";
              private static final String RECENTS_VIEW = "com.android.quickstep.views.RecentsView";
              private static final String TASK_VIEW = "com.android.quickstep.views.TaskView";

              // ===== Pengaturan tampilan (ubah lalu build ulang) =====
              /** Seberapa jauh tumpukan menyebar ke samping, dalam pecahan lebar layar. */
              static final float PEEK = 0.25f;
              /** Kecepatan kartu mendekati batas sebaran (makin besar = makin cepat rapat). */
              static final float PEEK_RATE = 1.3f;
              /** Pengurangan skala per satu kartu menjauh dari tengah. */
              static final float SCALE_STEP = 0.04f;
              /** Skala terkecil kartu. */
              static final float MIN_SCALE = 0.85f;
              /** Mulai memudar setelah sejauh ini (satuan: lebar kartu). */
              static final float FADE_START = 3.0f;
              /** Kecepatan memudar. */
              static final float FADE_RATE = 0.5f;
              // =======================================================

              private static final WeakHashMap<View, Boolean> TOUCHED = new WeakHashMap<View, Boolean>();
              private static Class<?> sTaskView;
              private static boolean sBusy = false;
              private static boolean sDisabled = false;

              @Override
              public void handleLoadPackage(LoadPackageParam lpparam) throws Throwable {
                  if (!TARGET_PKG.equals(lpparam.packageName)) {
                      return;
                  }
                  ClassLoader cl = lpparam.classLoader;
                  Class<?> recentsView = XposedHelpers.findClassIfExists(RECENTS_VIEW, cl);
                  sTaskView = XposedHelpers.findClassIfExists(TASK_VIEW, cl);
                  if (recentsView == null || sTaskView == null) {
                      XposedBridge.log(TAG + "RecentsView/TaskView tidak ditemukan, modul tidak aktif");
                      return;
                  }

                  XC_MethodHook after = new XC_MethodHook() {
                      @Override
                      protected void afterHookedMethod(MethodHookParam param) throws Throwable {
                          guard(param.thisObject);
                      }
                  };
                  XC_MethodHook before = new XC_MethodHook() {
                      @Override
                      protected void beforeHookedMethod(MethodHookParam param) throws Throwable {
                          guard(param.thisObject);
                      }
                  };

                  try {
                      XposedHelpers.findAndHookMethod(recentsView, "dispatchDraw", Canvas.class, before);
                  } catch (Throwable t) {
                      XposedBridge.log(TAG + "hook dispatchDraw gagal: " + t);
                  }
                  try {
                      XposedHelpers.findAndHookMethod(recentsView, "onScrollChanged",
                              int.class, int.class, int.class, int.class, after);
                  } catch (Throwable t) {
                      XposedBridge.log(TAG + "hook onScrollChanged gagal: " + t);
                  }
                  try {
                      XposedHelpers.findAndHookMethod(recentsView, "onLayout",
                              boolean.class, int.class, int.class, int.class, int.class, after);
                  } catch (Throwable t) {
                      XposedBridge.log(TAG + "hook onLayout gagal: " + t);
                  }
                  try {
                      XposedHelpers.findAndHookMethod(recentsView, "updateCurveProperties", after);
                  } catch (Throwable t) {
                      XposedBridge.log(TAG + "hook updateCurveProperties gagal: " + t);
                  }
                  XposedBridge.log(TAG + "aktif untuk " + TARGET_PKG);
              }

              /** Menjalankan efek tumpuk; jika terjadi error, modul mematikan diri agar launcher aman. */
              private static void guard(Object recentsView) {
                  if (sDisabled) {
                      return;
                  }
                  try {
                      applyStack(recentsView);
                  } catch (Throwable t) {
                      sDisabled = true;
                      XposedBridge.log(TAG + "error, efek dimatikan: " + t);
                  }
              }

              private static void applyStack(Object o) {
                  if (sBusy || !(o instanceof ViewGroup)) {
                      return;
                  }
                  ViewGroup rv = (ViewGroup) o;
                  int w = rv.getWidth();
                  int h = rv.getHeight();
                  int n = rv.getChildCount();

                  // Hanya mode potret satu baris; landscape/grid dibiarkan bawaan
                  if (w <= 0 || h <= w) {
                      for (int i = 0; i < n; i++) {
                          reset(rv.getChildAt(i));
                      }
                      return;
                  }

                  sBusy = true;
                  try {
                      float cx = rv.getScrollX() + w / 2f;
                      for (int i = 0; i < n; i++) {
                          View c = rv.getChildAt(i);
                          if (sTaskView == null || !sTaskView.isInstance(c)) {
                              continue;
                          }
                          int cw = c.getWidth();
                          if (cw <= 0) {
                              continue;
                          }
                          // posisi tengah kartu relatif terhadap tengah layar (tanpa translasi)
                          float delta = c.getLeft() + cw / 2f - cx;
                          float aq = Math.abs(delta) / cw;
                          if (aq < 0.02f) {
                              // kartu di tengah dibiarkan bawaan launcher (animasi buka tetap normal)
                              reset(c);
                              continue;
                          }
                          float sign = delta > 0f ? 1f : -1f;
                          float shown = (float) (PEEK * w * (1.0 - Math.exp(-PEEK_RATE * aq)));
                          float tx = sign * shown - delta;
                          float scale = Math.max(MIN_SCALE, 1f - SCALE_STEP * aq);
                          float alpha = aq <= FADE_START
                                  ? 1f
                                  : Math.max(0f, 1f - FADE_RATE * (aq - FADE_START));

                          c.setTranslationX(tx);
                          c.setScaleX(scale);
                          c.setScaleY(scale);
                          c.setAlpha(alpha);
                          c.setTranslationZ(-aq * 10f);
                          TOUCHED.put(c, Boolean.TRUE);
                      }
                  } finally {
                      sBusy = false;
                  }
              }

              /** Mengembalikan kartu ke keadaan normal, hanya jika sebelumnya kita yang mengubahnya. */
              private static void reset(View c) {
                  if (c == null || TOUCHED.remove(c) == null) {
                      return;
                  }
                  c.setTranslationX(0f);
                  c.setScaleX(1f);
                  c.setScaleY(1f);
                  c.setAlpha(1f);
                  c.setTranslationZ(0f);
              }
          }
          EOF_14

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: HiOS-StackRecents-apk
          path: app/build/outputs/apk/debug/*.apk
